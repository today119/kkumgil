  if (!navigator.share) { copy(text); return; }
  // 카톡은 그림+글을 같이 받으면 글을 버리는 경우가 있어 → 글은 먼저 클립보드에도 넣어 둔다
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).catch(function () {});
  if (!x.stamp) { navigator.share({text: text}).catch(function () {}); return; }
  fetch('lead/' + x.stamp + '.jpg').then(function (r) { return r.blob(); }).then(function (b) {
    var f = new File([b], '스탬프_' + x.p + '.jpg', {type: 'image/jpeg'});
    var d = {files: [f], text: text};
    if (navigator.canShare && !navigator.canShare(d)) d = {text: text};
    return navigator.share(d).then(function () { if (d.files) toast('글이 빠졌으면 카톡 입력창에 붙여 넣기 하세요'); });
  }).catch(function (e) { if (!e || e.name !== 'AbortError') navigator.share({text: text}).catch(function () {}); });
}

document.querySelector('.seg').onclick = function (e) {
  var b = e.target.closest('button'); if (!b) return;
  day = b.dataset.d; ED = null; ls('kg_lead_day', day); render(); scrollNow();
};
$('list').onclick = function (e) {
  var li = e.target.closest('li[data-j]'), b = e.target.closest('button[data-a]');
  if (li && !ED) {
    var s = st[li.dataset.id] || (st[li.dataset.id] = {ck: []}), j = +li.dataset.j, p = s.ck.indexOf(j);
    if (p >= 0) s.ck.splice(p, 1); else s.ck.push(j);
    save(); render(); return;
  }
  if (!b) return;
  var a = b.dataset.a, id = b.dataset.id, k = +b.dataset.k, F;
  var x = id ? list().filter(function (y) { return y.id === id; })[0] : null;
  if (a === 'share') return share(x, x.msgs[k]);
  if (a === 'copy') return copy(x.msgs[k]);
  if (a === 'cancel') { ED = null; return render(); }
  if (a === 'medit') { ED = {id: id, m: k}; return render(); }
  if (a === 'mnew') { ED = {id: id, m: 'new'}; return render(); }
  if (a === 'pedit') { ED = {id: id, m: 'p'}; return render(); }
  if (a === 'msave') { F = find(id); F.x.msgs[k] = $('e_msg').value; ED = null; saveData(); toast('저장했어요'); return render(); }
  if (a === 'madd') { var v = $('e_msg').value.trim(); if (!v) { ED = null; return render(); } F = find(id); F.x.msgs.push(v); ED = null; saveData(); toast('메시지를 추가했어요'); return render(); }
  if (a === 'mdel') { if (!confirm('이 메시지를 지울까요?')) return; F = find(id); F.x.msgs.splice(k, 1); ED = null; saveData(); return render(); }
  if (a === 'psave') {
    F = find(id);
    F.x.t = $('e_t').value.trim(); F.x.p = $('e_p').value.trim() || '(이름 없음)';
    F.x.todo = $('e_todo').value.split('\n').map(function (l) { return l.trim(); }).filter(Boolean).map(function (l) {
      var m = l.match(/^([^:：]{1,8})[:：]\s*(.+)$/); return m ? [m[1].trim(), m[2]] : ['전체', l];
    });
    delete st[id]; save();                    // 할 일 순서가 바뀌었을 수 있어 체크는 비운다
    ED = null; saveData(); toast('저장했어요'); return render();
  }
  if (a === 'pdel') { if (!confirm('«' + x.p + '» 일정을 지울까요?')) return; F = find(id); F.L.splice(F.i, 1); ED = null; saveData(); return render(); }
  if (a === 'pnew') {
    F = find(id); var nid = 'n' + Date.now().toString(36);
    F.L.splice(F.i + 1, 0, {id: nid, t: '', p: '새 일정', stamp: '', sn: '', todo: [], msgs: []});
    ED = {id: nid, m: 'p'}; saveData(); return render();
  }
  if (a === 'fin') {
    var s2 = st[id] || (st[id] = {ck: []});
    if (s2.done) delete s2.done;
    else { var d = new Date(); s2.done = ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2); }
    save(); render(); if (s2.done) scrollNow();
  }
};
$('reset').onclick = function () {
  if (!confirm(DAYS[day] + ' 체크·완료 기록을 지울까요?')) return;
  list().forEach(function (x) { delete st[x.id]; delete GEO.hit[x.id]; });
  ls('kg_lead_arr', GEO.hit); save(); render();
};
$('restore').onclick = function () {
  if (!confirm(DAYS[day] + '에서 고친 내용(메시지·일정)을 모두 버리고 처음 내용으로 돌릴까요?')) return;
  delete DATA[day]; ED = null; saveData(); render();
};
function scrollNow() { var n = document.querySelector('.card.now'); if (n) window.scrollTo({top: n.offsetTop - 150, behavior: 'smooth'}); }

/* 📍 도착 알림(10/29) — 선두 선생님 폰이 스탬프 지점 150m 안에 들어가면 진동·소리 + «스탬프 카드 보내기».
   웹페이지라 화면이 꺼지거나 다른 앱으로 가면 위치가 멈춘다 → 켜 두는 동안 화면 꺼짐 방지(wakeLock). */
var GEO = {on: false, w: null, pos: null, lock: null, ac: null, S: null, hit: ls('kg_lead_arr') || {}};
var R_ARR = 150;
function distM(a, b, c, d) { var k = Math.PI / 180, x = (d - b) * k * Math.cos((a + c) / 2 * k), y = (c - a) * k; return Math.sqrt(x * x + y * y) * 6371000; }
function stampPhases() { return list().filter(function (x) { return x.stamp && GEO.S && GEO.S[x.stamp]; }); }
function beep() {
  try {
    var ac = GEO.ac; if (!ac) return; ac.resume && ac.resume();
    [0, .35, .7].forEach(function (t) {
      var o = ac.createOscillator(), g = ac.createGain(); o.frequency.value = 880; o.connect(g); g.connect(ac.destination);
      g.gain.setValueAtTime(.0001, ac.currentTime + t); g.gain.exponentialRampToValueAtTime(.5, ac.currentTime + t + .02); g.gain.exponentialRampToValueAtTime(.0001, ac.currentTime + t + .28);
      o.start(ac.currentTime + t); o.stop(ac.currentTime + t + .3);
    });
  } catch (e) {}
}
function arrive(x) {
  GEO.hit[x.id] = Date.now(); ls('kg_lead_arr', GEO.hit);
  if (navigator.vibrate) navigator.vibrate([400, 150, 400, 150, 400]);
  beep();
  var e = $('arr');
  e.innerHTML = '<b>🏅 ' + esc(GEO.S[x.stamp].name) + ' 도착!</b><small>' + esc(x.p) + ' · 스탬프 카드를 단톡에 보낼 때예요</small>'
    + '<div class="btns"><button class="share" data-arr="send" data-id="' + x.id + '">📤 스탬프 카드 보내기</button><button class="copy" data-arr="go" data-id="' + x.id + '">카드 보기</button></div>'
    + '<div class="btns"><button class="copy" data-arr="x" style="background:rgba(255,255,255,.25);color:#fff">닫기</button></div>';
  e.classList.add('on');
}
$('arr').onclick = function (ev) {
  var b = ev.target.closest('button[data-arr]'); if (!b) return;
  var a = b.dataset.arr, x = list().filter(function (y) { return y.id === b.dataset.id; })[0];
  $('arr').classList.remove('on');
  if (a === 'send' && x) share(x, x.msgs[0]);
  if (a === 'go' && x) { var i = list().indexOf(x), c = $('c' + i); if (c) window.scrollTo({top: c.offsetTop - 150, behavior: 'smooth'}); }
};
function onGeo(p) {
  var lat = p.coords.latitude, lng = p.coords.longitude, acc = p.coords.accuracy;
  GEO.pos = [lat, lng];
  var L = stampPhases(), best = null, bd = 1e9, hr = new Date().getHours();
  L.forEach(function (x) {
    var s = GEO.S[x.stamp], d = distM(lat, lng, s.lat, s.lng);
    if (GEO.hit[x.id] || d > R_ARR + Math.min(acc || 0, 60)) return;
    if (x.stamp === 'school' && hr < 14) return;            // 아침 출발 때 학교에서 울리지 않게
    if ((st[x.id] || {}).done) return;
    arrive(x);
  });
  L.forEach(function (x) { var s = GEO.S[x.stamp], d = distM(lat, lng, s.lat, s.lng); if (!GEO.hit[x.id] && d < bd) { bd = d; best = x; } });
  $('geoTx').textContent = best ? '다음 🏅 ' + GEO.S[best.stamp].name + '까지 ' + (bd < 1000 ? Math.round(bd / 10) * 10 + 'm' : (bd / 1000).toFixed(1) + 'km') + (acc > 80 ? ' (위치 흐림)' : '') : (L.length ? '이 날 스탬프 알림은 다 울렸어요' : '이 탭에는 스탬프 일정이 없어요');
}
function keepAwake() {
  if (!GEO.on || !navigator.wakeLock || document.visibilityState !== 'visible') return;
  navigator.wakeLock.request('screen').then(function (l) { GEO.lock = l; }).catch(function () {});
}
document.addEventListener('visibilitychange', keepAwake);
function geoStart() {
  if (!navigator.geolocation) { toast('이 폰에서는 위치를 쓸 수 없어요'); return; }
  try { GEO.ac = GEO.ac || new (window.AudioContext || window.webkitAudioContext)(); GEO.ac.resume(); } catch (e) {}
  GEO.on = true; ls('kg_lead_geo', 1);
  $('geoBtn').classList.add('on'); $('geoBtn').textContent = '📍 알림 켜짐';
  $('geoTx').textContent = '위치를 찾는 중… 화면을 켜 둔 채로 두세요';
  var go = function () {
    GEO.w = navigator.geolocation.watchPosition(onGeo, function (e) { $('geoTx').textContent = e.code === 1 ? '위치 권한을 허용해 주세요' : '위치를 못 찾고 있어요'; }, {enableHighAccuracy: true, maximumAge: 5000, timeout: 30000});
  };
  if (GEO.S) go(); else fetch('stamps.json', {cache: 'no-cache'}).then(function (r) { return r.json(); }).then(function (d) {
    GEO.S = {}; (d.stamps || []).forEach(function (s) { if (s.lat != null) GEO.S[s.id] = s; }); go();
  }).catch(function () { $('geoTx').textContent = '스탬프 위치를 못 불러왔어요'; });
  keepAwake();
}
function geoStop() {
  GEO.on = false; ls('kg_lead_geo', 0);
  if (GEO.w != null) navigator.geolocation.clearWatch(GEO.w); GEO.w = null;
  if (GEO.lock) { GEO.lock.release().catch(function () {}); GEO.lock = null; }
  $('geoBtn').classList.remove('on'); $('geoBtn').textContent = '📍 도착 알림 켜기';
  $('geoTx').textContent = '스탬프 지점 150m 안에 들어가면 알려 줘요';
}
$('geoBtn').onclick = function () { if (GEO.on) geoStop(); else geoStart(); };
if (ls('kg_lead_geo')) { $('geoTx').textContent = '«📍 도착 알림 켜기»를 다시 눌러 주세요(소리 허용)'; }
render(); setTimeout(scrollNow, 100);
</script>
