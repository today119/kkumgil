 {t:'13:30~15:00', p:'을왕 → 용유초 (염전길)', stamp:'yeomjeon', sn:'7/7', todo:[[K,'14.9 · 15.5km 갈림길: 오른쪽 → 왼쪽'],[K,'염전 스탬프 카드 보내기']],
  msg:'🏅 [스탬프 7/7]\n용유 염전!\n앱 → 스탬프 → 용유 염전 → 📷 → 마지막 퀴즈.\n7곳 다 모았으면 앱에서 «스탬프 인증 제출»까지 눌러 주세요 🏅'},
 {t:'15:00', p:'용유초 · 휴식', todo:[[S,'음료 배분'],['담임','인원 확인']],
  msg:'[도착]\n용유초에서 휴식합니다 🥤 음료 받아 가세요. 15:20 버스 탑승합니다.'},
 {t:'15:20', p:'버스 → 학교 강당 · 하교', todo:[[K,'호차별 탑승 인원 확인'],[K,'「전원 도착」 공지']],
  msg:'[버스 탑승]\n탑승 인원은 현황판으로 보고 부탁드립니다.\n학교 강당에서 하교 지도합니다. 이틀 동안 정말 수고 많으셨습니다 🙏'}
]};

function ls(k, v) { try { if (v === undefined) return JSON.parse(localStorage.getItem(k) || 'null'); localStorage.setItem(k, JSON.stringify(v)); } catch (e) { return null; } }
var day = ls('kg_lead_day') || (new Date().getDate() === 31 ? 2 : 1);
var st = ls('kg_lead_st') || {};          // {'1-3':{ck:[0,2], done:'09:32'}}
function save() { ls('kg_lead_st', st); }
function $(id) { return document.getElementById(id); }
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function toast(t) { var e = $('toast'); e.textContent = t; e.classList.add('on'); clearTimeout(e._t); e._t = setTimeout(function () { e.classList.remove('on'); }, 1800); }

function render() {
  document.querySelectorAll('.seg button').forEach(function (b) { b.classList.toggle('on', +b.dataset.d === day); });
  $('who').innerHTML = WHO[day].map(function (w) { return '<span class="' + TAG[w[0]] + '">' + w[0] + ' · ' + w[1] + '</span>'; }).join('');
  var arr = P[day], nDone = 0, nowSet = false, h = '';
  arr.forEach(function (x, i) {
    var s = st[day + '-' + i] || {ck: []}, done = !!s.done;
    if (done) nDone++;
    var now = !done && !nowSet; if (now) nowSet = true;
    h += '<div class="card' + (done ? ' done' : '') + (now ? ' now' : '') + '" id="c' + i + '">'
      + '<div class="ch"><div class="num">' + (i + 1) + '</div><div class="ct"><b>' + esc(x.p) + '</b><small>' + esc(x.t) + (done ? ' · ✅ ' + s.done + ' 완료' : '') + '</small></div>'
      + (x.stamp ? '<span class="stp">🏅 스탬프 ' + x.sn + '</span>' : '') + '</div>'
      + '<div class="body"><ul class="todo">'
      + x.todo.map(function (t, j) {
          var ok = s.ck.indexOf(j) >= 0;
          return '<li class="' + (ok ? 'ok' : '') + '" data-i="' + i + '" data-j="' + j + '"><span class="bx">' + (ok ? '✓' : '') + '</span><span class="tx"><span class="tg ' + TAG[t[0]] + '">' + t[0] + '</span>' + esc(t[1]) + '</span></li>';
        }).join('') + '</ul>'
      + (x.stamp ? '<img class="img" src="lead/' + x.stamp + '.jpg" alt="" loading="lazy">' : '')
      + '<div class="msg">' + esc(x.msg) + '</div>'
      + '<div class="btns"><button class="share" data-i="' + i + '">📤 단톡으로 보내기</button><button class="copy" data-i="' + i + '">📋 문구 복사</button></div>'
      + '<div class="btns"><button class="fin" data-i="' + i + '">' + (done ? '↩ 완료 취소' : '✅ 이 국면 완료') + '</button></div>'
      + '</div></div>';
  });
  $('list').innerHTML = h;
  $('bar').style.width = (nDone / arr.length * 100) + '%';
  $('sub').textContent = (day === 1 ? '1학년 도보 25km' : '1·2학년 희망자 · 무의도~용유') + ' · ' + nDone + '/' + arr.length + ' 완료';
}

function copy(t) {
  if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(t).then(function () { toast('문구를 복사했어요 — 카톡에 붙여 넣으세요'); }, function () { fallbackCopy(t); });
  fallbackCopy(t);
}
function fallbackCopy(t) {
  var a = document.createElement('textarea'); a.value = t; document.body.appendChild(a); a.select();
  try { document.execCommand('copy'); toast('문구를 복사했어요'); } catch (e) { toast('복사가 안 돼요 — 길게 눌러 복사해 주세요'); }
  a.remove();
}
function share(x) {
  if (!navigator.share) { copy(x.msg); return; }
  // 카톡은 그림+글을 같이 받으면 글을 버리는 경우가 있어 → 글은 먼저 클립보드에도 넣어 둔다
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(x.msg).catch(function () {});
  if (!x.stamp) { navigator.share({text: x.msg}).catch(function () {}); return; }
  fetch('lead/' + x.stamp + '.jpg').then(function (r) { return r.blob(); }).then(function (b) {
    var f = new File([b], '스탬프_' + x.p + '.jpg', {type: 'image/jpeg'});
    var d = {files: [f], text: x.msg};
    if (navigator.canShare && !navigator.canShare(d)) d = {text: x.msg};
    return navigator.share(d).then(function () { if (d.files) toast('글이 빠졌으면 카톡 입력창에 붙여 넣기 하세요'); });
  }).catch(function (e) { if (!e || e.name !== 'AbortError') navigator.share({text: x.msg}).catch(function () {}); });
}

document.querySelector('.seg').onclick = function (e) {
  var b = e.target.closest('button'); if (!b) return;
  day = +b.dataset.d; ls('kg_lead_day', day); render(); scrollNow();
};
$('list').onclick = function (e) {
  var li = e.target.closest('li[data-j]'), b = e.target.closest('button');
  if (li) {
    var k = day + '-' + li.dataset.i, s = st[k] || (st[k] = {ck: []}), j = +li.dataset.j, p = s.ck.indexOf(j);
    if (p >= 0) s.ck.splice(p, 1); else s.ck.push(j);
    save(); render(); return;
  }
  if (!b) return;
  var i = +b.dataset.i, x = P[day][i];
  if (b.classList.contains('share')) share(x);
  else if (b.classList.contains('copy')) copy(x.msg);
  else if (b.classList.contains('fin')) {
    var k2 = day + '-' + i, s2 = st[k2] || (st[k2] = {ck: []});
    if (s2.done) delete s2.done;
    else { var d = new Date(); s2.done = ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2); }
    save(); render(); if (s2.done) scrollNow();
  }
};
$('reset').onclick = function () {
  if (!confirm(day + '일차 체크·완료 기록을 지울까요?')) return;
  Object.keys(st).forEach(function (k) { if (k.indexOf(day + '-') === 0) delete st[k]; });
  save(); render();
};
function scrollNow() { var n = document.querySelector('.card.now'); if (n) window.scrollTo({top: n.offsetTop - 150, behavior: 'smooth'}); }
render(); setTimeout(scrollNow, 100);
</script>
</body></html>
