<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>지도 비교 — 꿈길 걷기</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif}
  body{display:flex;flex-direction:column;background:#0B1220;color:#E2E8F0}
  header{padding:10px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  h1{font-size:15px;margin:0 8px 0 0;font-weight:900}
  button{font:inherit;font-weight:800;font-size:13px;padding:8px 12px;border:0;border-radius:10px;
    background:#1E293B;color:#94A3B8}
  button.on{background:#38BDF8;color:#04263A}
  #map{flex:1;min-height:0}
  .note{padding:8px 12px;font-size:12px;color:#94A3B8;line-height:1.5}
</style>
</head>
<body>
<header>
  <h1>지도 비교</h1>
  <button data-t="osm" class="on">OSM 기본</button>
  <button data-t="topo">등고선(산길)</button>
  <button data-t="sat">위성</button>
</header>
<div id="map"></div>
<div class="note" id="note"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
var TILES = {
  osm:   {url:"https://tile.openstreetmap.org/{z}/{x}/{y}.png", max:19,
          att:"© OpenStreetMap 기여자", note:"한글 지명이 가장 잘 나옵니다. 무료·키 불필요. 다만 OSM 재단이 «대량 사용»을 권하지 않습니다(281명이 8시간이면 애매)."},
  topo:  {url:"https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png", max:17,
          att:"© OpenTopoMap (CC-BY-SA)", note:"등고선이 보입니다. 백운산 산길 구간에서 오르내림을 확인할 때 좋습니다."},
  sat:   {url:"https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", max:19,
          att:"© Esri", note:"위성 사진. 길이 실제로 어떻게 생겼는지 볼 때 좋지만 지명이 안 나옵니다."},
};
var map = L.map("map", {zoomControl:true});
var layer = null, line = null;

function setTile(k){
  var t = TILES[k];
  if(layer) map.removeLayer(layer);
  layer = L.tileLayer(t.url, {maxZoom:t.max, attribution:t.att}).addTo(map);
  document.getElementById("note").textContent = t.note;
  document.querySelectorAll("[data-t]").forEach(function(b){ b.classList.toggle("on", b.dataset.t === k); });
}
document.querySelectorAll("[data-t]").forEach(function(b){ b.onclick = function(){ setTile(b.dataset.t); }; });

var day = (location.search.match(/day=(\d)/) || [,"1"])[1];
fetch("course-day" + day + ".json").then(function(r){ return r.json(); }).then(function(C){
  document.querySelector("h1").textContent = C.title + " " + (C.lengthM/1000).toFixed(1) + "km";
  var pts = C.course.map(function(p){ return [p[0], p[1]]; });
  L.polyline(pts, {color:"#fff", weight:9, opacity:.85}).addTo(map);
  line = L.polyline(pts, {color:"#0EA5E9", weight:5}).addTo(map);
  (C.points||[]).forEach(function(p){
    L.circleMarker([p.lat, p.lng], {radius:5, color:"#fff", weight:2, fillColor:"#F59E0B", fillOpacity:1})
      .addTo(map).bindPopup(p.name + " · " + (p.m/1000).toFixed(2) + "km");
  });
  L.marker(pts[0]).addTo(map).bindPopup("출발");
  L.marker(pts[pts.length-1]).addTo(map).bindPopup("끝");
  map.fitBounds(line.getBounds(), {padding:[24,24]});
});
setTile((location.search.match(/[?&]t=(\w+)/)||[,"osm"])[1] in TILES ? location.search.match(/[?&]t=(\w+)/)[1] : "osm");
</script>
</body>
</html>
